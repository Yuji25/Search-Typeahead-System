# ============================================================
# nginx.conf — Frontend reverse proxy config
# ============================================================
# Serves the React SPA and proxies /api calls to backend.
# The frontend calls window.__BACKEND_URL__ or uses /api prefix.
# We proxy /api -> backend:3001 so the browser only sees port 80.
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for the React build
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files; fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the Express backend
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward custom headers (ranking mode toggle)
        proxy_pass_request_headers on;
    }

    # Error pages
    error_page 404 /index.html;
}
